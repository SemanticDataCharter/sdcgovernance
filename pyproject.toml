[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdc-governance"
version = "4.0.0"
description = "W3C standards-based runtime governance for the Semantic Data Charter ecosystem"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "Semantic Data Charter Foundation"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://semanticdatacharter.com"
Repository = "https://github.com/SemanticDataCharter/SDC_Governance"
Issues = "https://github.com/SemanticDataCharter/SDC_Governance/issues"

[tool.setuptools.packages.find]
where = ["src"]
